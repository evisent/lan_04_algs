[project]
name = "algotool"
version = "0.1.0"
description = "Fibonacci, Queue, сортировки, генераторы"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
algotool = "algotool.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]